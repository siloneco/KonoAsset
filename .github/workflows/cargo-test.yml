name: Cargo Test
on:
  push:
    paths:
      - "src-backend/**"
      - "changelog.json"
      - "rust-toolchain.toml"
      - ".github/workflows/cargo-test.yml"
    branches:
      - "main"
      - "pre-release"
      - "develop"
  pull_request:
    types:
      - reopened
      - opened
      - synchronize
    paths:
      - "src-backend/**"
      - "changelog.json"
      - "rust-toolchain.toml"
      - ".github/workflows/cargo-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run cargo test
    env:
      # Keep backtrace line numbers without large type/variable debug information.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-backend -> target"

      - name: Run Test
        working-directory: src-backend
        run: cargo test --locked --all-features
