name: "Tauri Build Test"

on:
  pull_request:
    branches:
      - main
      - pre-release
      - "develop"
    types:
      - opened
      - synchronize
      - reopened
    paths: &build-paths
      - "src/**"
      - "public/**"
      - "src-backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "changelog.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "postcss.config.*"
      - ".github/workflows/build-test.yml"
      - ".github/workflows/actions.lock"
  push:
    paths: *build-paths
    branches:
      - "main"
      - "pre-release"
      - "develop"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-tauri:
    name: Tauri Build Test
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/setup@v3.1.1
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          prefix-key: "v0-rust-${{ runner.os }}"
          shared-key: test-tauri
          workspaces: "./src-backend -> target"

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--no-bundle"
