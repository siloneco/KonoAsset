name: Actions Lockfile Check

on:
  push:
    branches:
      - main
      - pre-release
      - develop
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify --no-interactive
