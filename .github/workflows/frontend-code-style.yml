name: Frontend Code Style Test
on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "e2e/**"
      - "tsconfig*.json"
      - "vite.config.*"
      - "eslint.config.*"
      - ".prettier*"
      - ".github/workflows/frontend-code-style.yml"
    branches:
      - "main"
      - "pre-release"
      - "develop"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "e2e/**"
      - "tsconfig*.json"
      - "vite.config.*"
      - "eslint.config.*"
      - ".prettier*"
      - ".github/workflows/frontend-code-style.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-code-style-test:
    name: Frontend Code Style Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/setup@v3.1.1
        with:
          cache: true
          save-cache: false
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run fmt:check
